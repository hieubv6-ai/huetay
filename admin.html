<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị · Huệ Tây Vinhomes</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css?v=20261007"></head><body><main class="shell"><section id="login" class="login-card"><div class="mark"><img src="assets/avatar-hue-tay.jpg" alt="Huệ Tây"></div><div class="eyebrow">HUỆ TÂY VINHOMES · CMS</div><h1>Trung tâm nội dung</h1><p>Quản lý dự án, căn đang bán và bài viết từ một nơi.</p><form id="login-form"><label>EMAIL ADMIN<input id="email" type="email" required value="" placeholder="Email bạn dùng trong Supabase"></label><label>MẬT KHẨU QUẢN TRỊ<input id="password" type="password" required placeholder="Nhập mật khẩu"></label><button type="button" id="login-submit" onclick="window.htLoginFallback()">Đăng nhập</button><button type="button" id="reset-password" class="ghost">Quên mật khẩu?</button><small id="login-error"></small></form></section><section id="app" hidden><header class="top"><div><div class="eyebrow">HUỆ TÂY VINHOMES · ADMIN</div><h1>Trung tâm nội dung</h1></div><button id="logout" class="ghost">Đăng xuất</button></header><div id="notice"></div><nav class="tabs"><button class="active" data-tab="dashboard">Tổng quan</button><button data-tab="projects">Dự án & căn</button><button data-tab="articles">Bài viết</button><button data-tab="leads">Khách hàng</button><button data-tab="profile-settings">Thông tin Huệ Tây</button><button data-tab="ai-writer">✍️ AI Writer Studio</button></nav><section id="dashboard" class="tab active"></section><section id="projects" class="tab" hidden></section><section id="articles" class="tab" hidden></section><section id="leads" class="tab" hidden></section><section id="profile-settings" class="tab" hidden></section><section id="ai-writer" class="tab" hidden></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261007"></script><script src="admin.js?v=20261007"></script><script src="ai-writer.js?v=20261007"></script><script>(function(){const f=document.getElementById('login-form');if(!f)return;window.htLoginFallback=async function(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,error=document.getElementById('login-error'),button=document.getElementById('login-submit');if(!email||!password){error.textContent='Vui lòng nhập email và mật khẩu.';return}button.disabled=true;error.textContent='Đang kiểm tra thông tin đăng nhập…';try{const r=await window.htSupabase.auth.signInWithPassword({email,password});if(r.error)throw r.error;error.textContent='Đăng nhập thành công, đang tải CMS…';setTimeout(function(){location.href='admin.html?logged_in=1';},100)}catch(x){error.textContent=x.message==='Invalid login credentials'?'Email hoặc mật khẩu chưa đúng.':x.message;button.disabled=false}};f.addEventListener('submit',function(e){e.preventDefault();window.htLoginFallback()})})();</script></body></html>
