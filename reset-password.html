<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu · Huệ Tây Vinhomes"><link rel="stylesheet" href="admin.css"><style>body{display:grid;place-items:center;min-height:100vh}.reset-card{width:min(440px,calc(100% - 28px));background:#fff;padding:30px;border-radius:20px;box-shadow:0 20px 60px #092a4320}.reset-card h1{font-family:'Playfair Display',Georgia,serif}.reset-card label{display:block;margin:16px 0 6px;font-size:11px;font-weight:700}.reset-card input{width:100%;padding:12px;border:1px solid #dbe8e6;border-radius:9px}.reset-card button{margin-top:18px;width:100%}.reset-note{font-size:12px;color:#607887;margin-top:13px}</style></head><body><main class="reset-card"><div class="eyebrow">HUỆ TÂY VINHOMES · CMS</div><h1>Đặt lại mật khẩu</h1><p>Nhập mật khẩu mới cho tài khoản quản trị.</p><form id="reset-form"><label>MẬT KHẨU MỚI<input id="password" type="password" minlength="8" required placeholder="Ít nhất 8 ký tự"></label><label>XÁC NHẬN MẬT KHẨU<input id="confirm" type="password" minlength="8" required placeholder="Nhập lại mật khẩu"></label><button type="submit">Lưu mật khẩu mới</button></form><p id="note" class="reset-note"></p><a href="admin.html">← Quay lại trang quản trị</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>document.getElementById('reset-form').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value,n=document.getElementById('note');if(p!==c){n.textContent='Mật khẩu xác nhận chưa khớp.';return}const r=await window.htSupabase.auth.updateUser({password:p});if(r.error){n.textContent=r.error.message;return}n.textContent='Đã đổi mật khẩu. Bạn có thể đăng nhập lại.';setTimeout(()=>location.href='admin.html',1200)};</script></body></html>
